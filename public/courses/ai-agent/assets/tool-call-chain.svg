<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <rect width="1000" height="520" fill="#ffffff"/>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#6b5f6b} .box{font-size:15;font-weight:bold} .line{font-size:13;fill:#8a7f8a} .fault{font-size:13;font-weight:bold;fill:#c77b6b}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3a5b3"/></marker></defs>
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold">一次工具调用的完整链路：六道闸门</text>

  <!-- 模型 -->
  <rect x="40" y="80" width="210" height="120" rx="8" fill="#ffdfd3" stroke="#b3a5b3" stroke-width="2"/>
  <text class="box" x="145" y="106" text-anchor="middle">模型 LLM</text>
  <text class="line" x="145" y="130" text-anchor="middle">只输出调用意图</text>
  <text class="line" x="145" y="150" text-anchor="middle">{"name", "arguments"}</text>
  <text class="fault" x="145" y="182" text-anchor="middle">看不到函数源码</text>

  <!-- 运行时外框 -->
  <rect x="290" y="60" width="430" height="230" rx="8" fill="#ffffff" stroke="#b3a5b3" stroke-width="2"/>
  <text class="box" x="505" y="84" text-anchor="middle">Agent Runtime（运行时）</text>

  <rect x="310" y="96" width="180" height="40" rx="6" fill="#ffdfd3" stroke="#b3a5b3" stroke-width="2"/>
  <text class="box" x="400" y="113" text-anchor="middle">① 解析调用</text>
  <text class="line" x="400" y="130" text-anchor="middle">取出 name 与 arguments</text>

  <rect x="310" y="146" width="180" height="40" rx="6" fill="#d4f0f0" stroke="#b3a5b3" stroke-width="2"/>
  <text class="box" x="400" y="163" text-anchor="middle">② 确认工具存在</text>
  <text class="line" x="400" y="180" text-anchor="middle">查注册表；未知 → 观察</text>

  <rect x="310" y="196" width="180" height="40" rx="6" fill="#fffacd" stroke="#b3a5b3" stroke-width="2"/>
  <text class="box" x="400" y="213" text-anchor="middle">③ 参数校验</text>
  <text class="line" x="400" y="230" text-anchor="middle">必填、类型、取值范围</text>

  <rect x="310" y="246" width="180" height="40" rx="6" fill="#e2dfff" stroke="#b3a5b3" stroke-width="2"/>
  <text class="box" x="400" y="263" text-anchor="middle">④ 权限检查</text>
  <text class="line" x="400" y="280" text-anchor="middle">角色对照工具权限标记</text>

  <!-- 失败观察 -->
  <rect x="530" y="110" width="170" height="140" rx="6" fill="#ffffff" stroke="#c77b6b" stroke-width="2"/>
  <text class="fault" x="615" y="136" text-anchor="middle">任何一步失败</text>
  <text class="line" x="615" y="160" text-anchor="middle">都回填一条观察：</text>
  <text class="line" x="615" y="180" text-anchor="middle">发生了什么 + 为什么</text>
  <text class="line" x="615" y="200" text-anchor="middle">+ 模型能做什么</text>
  <text class="line" x="615" y="224" text-anchor="middle">追加进 messages</text>
  <path d="M 492 216 L 528 190" fill="none" stroke="#c77b6b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- 工具注册表 -->
  <rect x="760" y="60" width="210" height="160" rx="8" fill="#e2dfff" stroke="#b3a5b3" stroke-width="2"/>
  <text class="box" x="865" y="86" text-anchor="middle">工具注册表</text>
  <text class="line" x="865" y="110" text-anchor="middle">name / description</text>
  <text class="line" x="865" y="130" text-anchor="middle">参数 schema</text>
  <text class="line" x="865" y="150" text-anchor="middle">权限、副作用、超时标记</text>
  <text class="fault" x="865" y="182" text-anchor="middle">发给模型的只有前三行</text>
  <line x1="722" y1="166" x2="758" y2="166" stroke="#b3a5b3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 模型 -> 运行时 -->
  <line x1="250" y1="140" x2="288" y2="140" stroke="#b3a5b3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 运行时 -> 业务函数 -->
  <line x1="505" y1="290" x2="505" y2="328" stroke="#b3a5b3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 业务函数 -->
  <rect x="350" y="330" width="310" height="120" rx="8" fill="#d4f0f0" stroke="#b3a5b3" stroke-width="2"/>
  <text class="box" x="505" y="356" text-anchor="middle">⑤ 执行业务函数</text>
  <text class="line" x="505" y="380" text-anchor="middle">search_records / add_plan</text>
  <text class="line" x="505" y="400" text-anchor="middle">真正读写生活管家的数据</text>
  <text class="fault" x="505" y="428" text-anchor="middle">慢：超时包装只是不再等待，不是强杀</text>

  <!-- Observation -->
  <rect x="40" y="330" width="210" height="120" rx="8" fill="#fffacd" stroke="#b3a5b3" stroke-width="2"/>
  <text class="box" x="145" y="356" text-anchor="middle">⑥ Observation 写回</text>
  <text class="line" x="145" y="380" text-anchor="middle">成功、失败都成观察</text>
  <text class="line" x="145" y="400" text-anchor="middle">追加进 messages</text>
  <text class="line" x="145" y="420" text-anchor="middle">回到模型再决策</text>

  <line x1="350" y1="390" x2="252" y2="390" stroke="#b3a5b3" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="145" y1="330" x2="145" y2="202" stroke="#b3a5b3" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="500" y="492" text-anchor="middle" font-size="14" fill="#8a7f8a">前四道闸门全部在运行时，模型只产出意图；任何一道失败都变成观察写回，循环继续而不是崩溃。</text>
</svg>
