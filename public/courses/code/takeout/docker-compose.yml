# 外卖课程第 2 课：开发环境
# 一条命令启动：FastAPI 应用 + MySQL + Redis + Nginx 网关
# 使用前：复制 .env.example 为 .env，按需修改密码

services:
  mysql:
    image: mysql:8
    container_name: takeout-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"            # 本机 3306 -> 容器 3306
    volumes:
      - mysql-data:/var/lib/mysql   # 数据卷：容器删除后数据仍在
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: takeout-redis
    ports:
      - "6379:6379"            # 本机 6379 -> 容器 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend            # 用 Dockerfile 构建
    container_name: takeout-backend
    environment:
      REDIS_HOST: redis         # 容器内通过服务名访问，不是 localhost
      REDIS_PORT: "6379"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy   # 等 MySQL 健康后再启动
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: takeout-nginx
    ports:
      - "8080:80"              # 网关入口：本机 8080 -> 容器 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mysql-data:
