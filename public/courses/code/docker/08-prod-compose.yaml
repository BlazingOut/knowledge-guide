# 第 8 课：生产版外卖系统编排
# 和 07-compose.yaml 相比：
#   1. 增加 nginx 反向代理，app 不再直接发布 8000
#   2. 增加 restart: unless-stopped
#   3. 给 app 增加资源限制
# 从仓库根目录启动：
#   docker compose -f code/docker/08-prod-compose.yaml up -d --build

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./08-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: 07-app.Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: example
      MYSQL_DATABASE: takeout
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: takeout
    volumes:
      - mysql-data:/var/lib/mysql
      - ./04-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pexample"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  redis-data:
  mysql-data:
