<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#f8fafc"/>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033} .field{font-size:15;font-weight:bold} .flag{font-size:13;font-weight:bold} .bits{font-size:13;fill:#475569} .note{font-size:14;fill:#334155}</style>
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold">本课记号在 TCP 头部中的位置</text>
  <text class="bits" x="240" y="66">0</text><text class="bits" x="370" y="66">15 | 16</text><text class="bits" x="742" y="66">31</text>

  <rect x="240" y="80" width="260" height="40" rx="6" fill="#e2e8f0"/><text class="field" x="370" y="105" text-anchor="middle">源端口</text>
  <rect x="500" y="80" width="260" height="40" rx="6" fill="#e2e8f0"/><text class="field" x="630" y="105" text-anchor="middle">目的端口</text>

  <rect x="240" y="120" width="520" height="40" rx="6" fill="#6ee7b7"/><text class="field" x="500" y="145" text-anchor="middle">序号 Sequence Number（32 位）</text>
  <text class="note" x="500" y="177" text-anchor="middle">↑ 本课记号 seq = x：本报文的数据从字节流第 x 字节开始</text>

  <rect x="240" y="190" width="520" height="40" rx="6" fill="#6ee7b7"/><text class="field" x="500" y="215" text-anchor="middle">确认号 Acknowledgment Number（32 位）</text>
  <text class="note" x="500" y="247" text-anchor="middle">↑ 本课记号 ack = y+1：y 之前都收到了，请发第 y+1 字节</text>

  <rect x="240" y="260" width="90" height="40" rx="6" fill="#e2e8f0"/><text x="285" y="284" text-anchor="middle" font-size="13">数据偏移+保留</text>
  <rect x="330" y="260" width="40" height="40" rx="6" fill="#e2e8f0"/><text class="flag" x="350" y="285" text-anchor="middle">URG</text>
  <rect x="370" y="260" width="40" height="40" rx="6" fill="#fca5a5"/><text class="flag" x="390" y="285" text-anchor="middle">ACK</text>
  <rect x="410" y="260" width="40" height="40" rx="6" fill="#e2e8f0"/><text class="flag" x="430" y="285" text-anchor="middle">PSH</text>
  <rect x="450" y="260" width="40" height="40" rx="6" fill="#e2e8f0"/><text class="flag" x="470" y="285" text-anchor="middle">RST</text>
  <rect x="490" y="260" width="40" height="40" rx="6" fill="#fca5a5"/><text class="flag" x="510" y="285" text-anchor="middle">SYN</text>
  <rect x="530" y="260" width="40" height="40" rx="6" fill="#fca5a5"/><text class="flag" x="550" y="285" text-anchor="middle">FIN</text>
  <rect x="570" y="260" width="190" height="40" rx="6" fill="#fde68a"/><text class="field" x="665" y="285" text-anchor="middle">窗口大小</text>
  <text class="note" x="440" y="317" text-anchor="middle">↑ 标志位是 6 个各占 1 位的开关；本课的 SYN、ACK、FIN 是红色的三个</text>

  <rect x="240" y="330" width="260" height="40" rx="6" fill="#e2e8f0"/><text class="field" x="370" y="355" text-anchor="middle">校验和</text>
  <rect x="500" y="330" width="260" height="40" rx="6" fill="#e2e8f0"/><text class="field" x="630" y="355" text-anchor="middle">紧急指针</text>

  <text class="note" x="500" y="398" text-anchor="middle">灰色 = 本课不展开的字段；黄色窗口大小 = 第 6 课流量控制的主角；绿色 = 可靠传输的两大支柱</text>
</svg>
