<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
  <rect width="1000" height="440" fill="#f8fafc"/>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033} .box{fill:#fff;stroke:#2563eb;stroke-width:3} .name{font-size:16;font-weight:bold;fill:#334155} .desc{font-size:13;fill:#334155} .label{font-size:14;fill:#475569} .note{font-size:14;fill:#334155} .chip{font-size:13}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="bold">一台计算机的组成：少数硬件，被所有程序共用</text>
  <text x="500" y="60" text-anchor="middle" font-size="14" fill="#475569">CPU 和内存紧挨在一起，磁盘在下方，网卡和键鼠屏幕是对外的接口</text>

  <!-- CPU：中央偏左上，真正干活的芯片 -->
  <rect class="box" x="200" y="84" width="280" height="100" rx="10"/>
  <text class="name" x="340" y="114" text-anchor="middle">CPU（中央处理器）</text>
  <text class="desc" x="340" y="136" text-anchor="middle">真正执行指令，核心数量有限</text>
  <rect fill="#93c5fd" x="230" y="148" width="58" height="22" rx="4"/><text class="chip" x="259" y="164" text-anchor="middle">核心 0</text>
  <rect fill="#93c5fd" x="298" y="148" width="58" height="22" rx="4"/><text class="chip" x="327" y="164" text-anchor="middle">核心 1</text>
  <rect fill="#93c5fd" x="366" y="148" width="58" height="22" rx="4"/><text class="chip" x="395" y="164" text-anchor="middle">…</text>

  <!-- 内存：紧挨 CPU 右侧 -->
  <rect class="box" x="520" y="84" width="280" height="100" rx="10"/>
  <text class="name" x="660" y="122" text-anchor="middle">内存</text>
  <text class="desc" x="660" y="150" text-anchor="middle">正在运行的代码和数据，离 CPU 最近</text>

  <path d="M480 134 H520" stroke="#475569" stroke-width="3" fill="none"/>
  <text class="label" x="500" y="124" text-anchor="middle">近</text>

  <!-- 系统总线：横贯中部 -->
  <path d="M340 184 V220" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#m)"/>
  <path d="M660 184 V220" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#m)"/>
  <rect x="140" y="224" width="720" height="44" rx="8" fill="#fff" stroke="#dc2626" stroke-width="3"/>
  <text class="name" x="500" y="252" text-anchor="middle">系统总线：CPU、内存和 IO 设备交换数据的公共通道</text>

  <!-- 下方三个外设：磁盘居中偏下（机箱内部），网卡和人机接口分列两侧 -->
  <path d="M250 268 V304" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#m)"/>
  <path d="M500 268 V304" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#m)"/>
  <path d="M750 268 V304" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#m)"/>

  <rect class="box" x="140" y="308" width="220" height="72" rx="10"/>
  <text class="name" x="250" y="338" text-anchor="middle">键盘 / 显示器</text>
  <text class="desc" x="250" y="362" text-anchor="middle">人机输入和输出，在机箱外面</text>

  <rect class="box" x="390" y="308" width="220" height="72" rx="10"/>
  <text class="name" x="500" y="338" text-anchor="middle">磁盘</text>
  <text class="desc" x="500" y="362" text-anchor="middle">文件和程序的持久副本</text>

  <rect class="box" x="640" y="308" width="220" height="72" rx="10"/>
  <text class="name" x="750" y="338" text-anchor="middle">网卡</text>
  <text class="desc" x="750" y="362" text-anchor="middle">收发网络数据包，对外接口</text>

  <text class="note" x="500" y="416" text-anchor="middle">没有操作系统时，每个程序都要自己去抢 CPU、自己去写内存地址、自己去驱动磁盘和网卡。</text>
</svg>
