<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
  <rect width="1000" height="460" fill="#f8fafc"/>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033} .box{fill:#fff;stroke:#2563eb;stroke-width:3} .box-hl{fill:#eff6ff;stroke:#3b82f6;stroke-width:3} .key{font-size:16;font-weight:bold} .name{font-size:15;fill:#334155} .desc{font-size:14;fill:#475569} .label{font-size:14;fill:#475569} .t-blue{fill:#1d4ed8} .arrow{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#m)} .arrow-blue{stroke:#3b82f6;stroke-width:3;fill:none;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold">B+ 树示例：非叶子节点只导航，叶子节点有序相连</text>

  <rect class="box" x="440" y="70" width="120" height="44" rx="8"/>
  <text x="500" y="99" text-anchor="middle" class="key">[3, 6]</text>

  <path class="arrow" d="M460 114 V140 H160 V236"/>
  <path class="arrow" d="M500 114 V236"/>
  <path class="arrow-blue" d="M540 114 V140 H840 V236"/>
  <text class="label" x="300" y="131" text-anchor="middle">key &lt; 3</text>
  <text class="label" x="514" y="160">3 ≤ key &lt; 6</text>
  <text class="label" x="700" y="131" text-anchor="middle">key ≥ 6</text>

  <rect class="box" x="105" y="236" width="110" height="60" rx="8"/>
  <text x="160" y="273" text-anchor="middle" class="key">[1, 2]</text>

  <rect class="box" x="425" y="236" width="150" height="60" rx="8"/>
  <text x="500" y="273" text-anchor="middle" class="key">[3, 4, 5]</text>

  <rect class="box-hl" x="765" y="236" width="150" height="60" rx="8"/>
  <text x="840" y="273" text-anchor="middle" class="key t-blue">[6, 7, 8]</text>

  <path class="arrow" d="M218 258 H420"/>
  <path class="arrow" d="M422 274 H222"/>
  <path class="arrow" d="M578 258 H762"/>
  <path class="arrow" d="M760 274 H580"/>
  <text class="desc" x="320" y="250" text-anchor="middle">叶子链表（双向）</text>

  <text class="desc" x="500" y="316" text-anchor="middle">叶子节点：保存 key 和对应的数据，按 key 从小到大排列</text>
  <text class="t-blue" x="500" y="342" text-anchor="middle" font-size="14">查找 id = 7：根 [3,6] → 右分支（key ≥ 6）→ 叶子 [6,7,8]，全程只读 2 个页</text>

  <rect class="box" x="100" y="356" width="800" height="86" rx="10"/>
  <text class="desc" x="112" y="380">非叶子只存 key（导航）；叶子存 key + 对应数据（InnoDB 主键索引的叶子存整行，见第三节）</text>
  <text class="desc" x="112" y="404">示意：真实页是 16KB，一页能装成千上万个 key，这里只为展示树的形状</text>
  <text class="desc" x="112" y="428">数据量扩大时，树高一般只多一两层，查找读的页数接近稳定</text>
</svg>
