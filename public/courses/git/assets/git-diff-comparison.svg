<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330">
  <rect width="1000" height="330" fill="#f8fafc"/><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.box{fill:#fff;stroke:#7c3aed;stroke-width:3}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <text x="500" y="40" text-anchor="middle" font-size="26" font-weight="bold">不同 diff 命令比较的两端</text>
  <rect class="box" x="70" y="90" width="220" height="75" rx="12"/><text x="180" y="135" text-anchor="middle" font-size="21">工作区</text><rect class="box" x="390" y="90" width="220" height="75" rx="12"/><text x="500" y="135" text-anchor="middle" font-size="21">暂存区</text><rect class="box" x="710" y="90" width="220" height="75" rx="12"/><text x="820" y="135" text-anchor="middle" font-size="21">HEAD</text>
  <path class="arrow" d="M290 128 H380"/><text x="335" y="115" text-anchor="middle" font-size="16">git diff</text><path class="arrow" d="M610 128 H700"/><text x="655" y="115" text-anchor="middle" font-size="16">diff --staged</text>
  <path class="arrow" d="M180 230 C350 190 650 190 820 230"/><text x="500" y="225" text-anchor="middle" font-size="16">git diff HEAD：工作区和暂存区相对 HEAD 的全部变化</text>
