<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <rect width="800" height="420" fill="#FFFFFF"/>
  <style>
    text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#6B5F6B}
    .axis{stroke:#B3A5B3;stroke-width:2}
    .grid{stroke:#E2DFFF;stroke-width:1;stroke-dasharray:5 5}
    .main{stroke:#FFDFD3;stroke-width:4;fill:none}
    .point{fill:#C77B6B}
    .label{font-size:15;fill:#8A7F8A}
    .title{font-size:22;font-weight:bold;fill:#6B5F6B}
  </style>
  <text x="400" y="42" text-anchor="middle" class="title">sigmoid：z 越大，输出概率越接近 1</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="340" x2="720" y2="340" class="axis"/>
  <line x1="80" y1="340" x2="80" y2="60" class="axis"/>

  <!-- 渐近线 -->
  <line x1="80" y1="60" x2="720" y2="60" class="grid"/>
  <line x1="80" y1="200" x2="720" y2="200" class="grid"/>

  <!-- sigmoid 曲线 -->
  <polyline class="main" points="
    80,339.3 106.7,338.9 133.3,338.1 160,336.9 186.7,335.0 213.3,331.8 240,326.7
    266.7,318.8 293.3,306.6 320,288.9 346.7,264.7 373.3,234.3 400,200 426.7,165.7
    453.3,135.3 480,111.1 506.7,93.4 533.3,81.2 560,73.3 586.7,68.2 613.3,65.0
    640,63.1 666.7,61.9 693.3,61.1 720,60.7"/>

  <!-- z=0, p=0.5 交点 -->
  <circle cx="400" cy="200" r="7" class="point"/>
  <text x="415" y="218" class="label">z=0 时 p=0.5</text>
  <text x="415" y="238" class="label">以此为判断阈值</text>

  <!-- z 轴刻度 -->
  <text x="400" y="365" text-anchor="middle" class="label">z = 0</text>
  <text x="120" y="365" text-anchor="middle" class="label">-6</text>
  <text x="660" y="365" text-anchor="middle" class="label">6</text>

  <!-- p 轴刻度 -->
  <text x="60" y="65" text-anchor="end" class="label">p=1</text>
  <text x="60" y="345" text-anchor="end" class="label">p=0</text>
  <text x="60" y="205" text-anchor="end" class="label">p=0.5</text>
</svg>
