<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
  <rect width="1000" height="360" fill="#f8fafc"/>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033} .box{fill:#fff;stroke:#2563eb;stroke-width:3} .name{font-size:16;font-weight:bold} .desc{font-size:15;fill:#334155}</style>
  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="bold">线性回归：特征加权求和，再加上常数项</text>
  <rect class="box" x="40" y="90" width="200" height="180" rx="10"/>
  <text class="name" x="140" y="130" text-anchor="middle">面积 x1</text>
  <text class="desc" x="140" y="175" text-anchor="middle">乘以 w1</text>
  <text class="desc" x="140" y="210" text-anchor="middle">例：50 × 3 = 150</text>
  <rect class="box" x="280" y="90" width="200" height="180" rx="10"/>
  <text class="name" x="380" y="130" text-anchor="middle">房龄 x2</text>
  <text class="desc" x="380" y="175" text-anchor="middle">乘以 w2</text>
  <text class="desc" x="380" y="210" text-anchor="middle">例：10 × 2 = 20</text>
  <rect class="box" x="520" y="90" width="200" height="180" rx="10"/>
  <text class="name" x="620" y="130" text-anchor="middle">常数项 b</text>
  <text class="desc" x="620" y="175" text-anchor="middle">不加特征</text>
  <text class="desc" x="620" y="210" text-anchor="middle">例：直接 + 10</text>
  <rect class="box" x="760" y="90" width="200" height="180" rx="10"/>
  <text class="name" x="860" y="130" text-anchor="middle">预测 ŷ</text>
  <text class="desc" x="860" y="175" text-anchor="middle">三项相加</text>
  <text class="desc" x="860" y="210" text-anchor="middle">150 + 20 + 10</text>
  <text class="desc" x="860" y="240" text-anchor="middle">= 180</text>
</svg>
