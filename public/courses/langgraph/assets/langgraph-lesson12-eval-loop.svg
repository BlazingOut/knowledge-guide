<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
  <rect width="900" height="380" fill="#FFFFFF"/>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#6B5F6B} .title{font-size:20;font-weight:bold} .head{font-size:13;font-weight:bold} .sub{font-size:11;fill:#8A7F8A} .label{font-size:12;fill:#8A7F8A} .note{font-size:12;fill:#8A7F8A} .arrow{stroke:#B3A5B3;stroke-width:2.5;fill:none;marker-end:url(#m)} .dash{stroke:#C77B6B;stroke-width:2;fill:none;stroke-dasharray:6,4;marker-end:url(#m2)}</style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#B3A5B3"/></marker>
    <marker id="m2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C77B6B"/></marker>
  </defs>

  <text class="title" x="450" y="32" text-anchor="middle">评估与回归闭环：固定评测集是"标尺"，改完必重跑</text>

  <!-- 主链：评测集 → 跑 Agent → 断言 → 指标 -->
  <rect x="40" y="80" width="170" height="76" rx="10" fill="#FFDFD3" stroke="#B3A5B3" stroke-width="1.5"/>
  <text class="head" x="125" y="104" text-anchor="middle">固定评测集</text>
  <text class="sub" x="125" y="122" text-anchor="middle">正常 + 边界 + 对抗用例</text>
  <text class="sub" x="125" y="138" text-anchor="middle">每条标期望轨迹和答案</text>

  <path class="arrow" d="M212 118 H248"/>

  <rect x="250" y="80" width="170" height="76" rx="10" fill="#D4F0F0" stroke="#B3A5B3" stroke-width="1.5"/>
  <text class="head" x="335" y="104" text-anchor="middle">跑 Agent</text>
  <text class="sub" x="335" y="122" text-anchor="middle">图执行，记录结果</text>
  <text class="sub" x="335" y="138" text-anchor="middle">（答案 + 整条调用轨迹）</text>

  <path class="arrow" d="M422 118 H458"/>

  <rect x="460" y="80" width="170" height="76" rx="10" fill="#FFFACD" stroke="#B3A5B3" stroke-width="1.5"/>
  <text class="head" x="545" y="104" text-anchor="middle">断言</text>
  <text class="sub" x="545" y="122" text-anchor="middle">规则断言：答案含期望子串</text>
  <text class="sub" x="545" y="138" text-anchor="middle">轨迹断言：调用序列一致</text>

  <path class="arrow" d="M632 118 H668"/>

  <rect x="670" y="80" width="190" height="76" rx="10" fill="#E2DFFF" stroke="#B3A5B3" stroke-width="1.5"/>
  <text class="head" x="765" y="104" text-anchor="middle">量化指标</text>
  <text class="sub" x="765" y="122" text-anchor="middle">成功率、工具正确率、</text>
  <text class="sub" x="765" y="138" text-anchor="middle">平均 token、平均耗时</text>

  <!-- 回归对比：改提示词 → 重跑同一评测集 -->
  <rect x="250" y="230" width="400" height="70" rx="10" fill="#D4F0F0" stroke="#B3A5B3" stroke-width="1.5"/>
  <text class="head" x="450" y="254" text-anchor="middle">改提示词 / 加工具 / 换模型后：重跑同一评测集</text>
  <text class="sub" x="450" y="274" text-anchor="middle">指标下降（如成功率 100%→88%）就是回归——定位到具体用例</text>

  <path class="dash" d="M450 230 V190"/>
  <text class="label" x="462" y="214">回归对比</text>

  <text class="note" x="450" y="340" text-anchor="middle">评测集是"标尺"：改前改后跑同一套才可比。改完不重跑 = 不知道改坏了什么。</text>
  <text class="note" x="450" y="360" text-anchor="middle">运行示例（第 12 课演示 C）：v1 成功率 100%/工具正确率 100% → v2 88%/75%，定位到两条用例。</text>
</svg>
