<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  <rect width="900" height="340" fill="#FFFFFF"/>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#6B5F6B} .title{font-size:20;font-weight:bold} .invoke{font-size:13;font-weight:bold} .ck{fill:#D4F0F0;stroke:#B3A5B3;stroke-width:1.5} .head{font-size:13;font-weight:bold} .sub{font-size:11;fill:#8A7F8A} .emph{font-size:12;fill:#C77B6B} .note{font-size:12;fill:#8A7F8A} .arrow{stroke:#B3A5B3;stroke-width:2.5;fill:none;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#B3A5B3"/></marker></defs>

  <text class="title" x="450" y="32" text-anchor="middle">同一线程的顺序保证：checkpoint 链（parent_checkpoint_id 链表）</text>

  <text class="invoke" x="259" y="78" text-anchor="middle">第一次 invoke（r1）</text>
  <text class="invoke" x="631" y="78" text-anchor="middle">第二次 invoke（r2）</text>

  <rect class="ck" x="80" y="100" width="110" height="56" rx="8"/>
  <text class="head" x="135" y="124" text-anchor="middle">ckpt c1</text>
  <text class="sub" x="135" y="142" text-anchor="middle">parent: —</text>
  <rect class="ck" x="204" y="100" width="110" height="56" rx="8"/>
  <text class="head" x="259" y="124" text-anchor="middle">ckpt c2</text>
  <text class="sub" x="259" y="142" text-anchor="middle">parent: c1</text>
  <rect class="ck" x="328" y="100" width="110" height="56" rx="8"/>
  <text class="head" x="373" y="124" text-anchor="middle">ckpt c3</text>
  <text class="sub" x="373" y="142" text-anchor="middle">parent: c2</text>
  <rect class="ck" x="452" y="100" width="110" height="56" rx="8"/>
  <text class="head" x="507" y="124" text-anchor="middle">ckpt c4</text>
  <text class="sub" x="507" y="142" text-anchor="middle">parent: c3</text>
  <rect class="ck" x="576" y="100" width="110" height="56" rx="8"/>
  <text class="head" x="631" y="124" text-anchor="middle">ckpt c5</text>
  <text class="sub" x="631" y="142" text-anchor="middle">parent: c4</text>
  <rect class="ck" x="700" y="100" width="110" height="56" rx="8"/>
  <text class="head" x="755" y="124" text-anchor="middle">ckpt c6</text>
  <text class="sub" x="755" y="142" text-anchor="middle">parent: c5</text>

  <path class="arrow" d="M192 128 H202"/>
  <path class="arrow" d="M316 128 H326"/>
  <path class="arrow" d="M440 128 H450"/>
  <path class="arrow" d="M564 128 H574"/>
  <path class="arrow" d="M688 128 H698"/>

  <text class="emph" x="507" y="180" text-anchor="middle">← 跨 invoke 衔接点：r2 的第一个 checkpoint（c4）parent 指向 r1 的最后一个（c3）</text>

  <text class="note" x="80" y="215">invoke 结束时：框架记录该线程停在了哪个 checkpoint（如 c3）。</text>
  <text class="note" x="80" y="237">下一次 invoke：从记录的 checkpoint 继续，新快照挂链尾——所以是"追加式"，后一次必然从前一次末尾继续，</text>
  <text class="note" x="80" y="259">与两次调用间隔多久无关；checkpoint_id 单调递增（带时间），时间只用于排序展示与审计。</text>
</svg>
