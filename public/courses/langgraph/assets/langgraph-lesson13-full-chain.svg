<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#FFFFFF"/>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#6B5F6B} .title{font-size:20;font-weight:bold} .head{font-size:12;font-weight:bold} .sub{font-size:10.5;fill:#8A7F8A} .label{font-size:11;fill:#8A7F8A} .note{font-size:12;fill:#8A7F8A} .arrow{stroke:#B3A5B3;stroke-width:2.5;fill:none;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#B3A5B3"/></marker></defs>

  <text class="title" x="450" y="32" text-anchor="middle">一个生产 Agent 的完整链路：每步用什么机制、坏了怎么查</text>

  <!-- 六个节点 -->
  <rect x="30" y="60" width="120" height="64" rx="8" fill="#FFDFD3" stroke="#B3A5B3" stroke-width="1.5"/>
  <text class="head" x="90" y="86" text-anchor="middle">① 用户消息</text>
  <text class="sub" x="90" y="102" text-anchor="middle">输入 state</text>
  <text class="sub" x="90" y="116" text-anchor="middle">（第 1~3 课）</text>

  <path class="arrow" d="M152 92 H168"/>

  <rect x="170" y="60" width="120" height="64" rx="8" fill="#D4F0F0" stroke="#B3A5B3" stroke-width="1.5"/>
  <text class="head" x="230" y="86" text-anchor="middle">② 路由</text>
  <text class="sub" x="230" y="102" text-anchor="middle">条件边/模型决策</text>
  <text class="sub" x="230" y="116" text-anchor="middle">（第 3 课）</text>

  <path class="arrow" d="M292 92 H308"/>

  <rect x="310" y="60" width="120" height="64" rx="8" fill="#E2DFFF" stroke="#B3A5B3" stroke-width="1.5"/>
  <text class="head" x="370" y="86" text-anchor="middle">③ 工具调用</text>
  <text class="sub" x="370" y="102" text-anchor="middle">@tool / ToolNode</text>
  <text class="sub" x="370" y="116" text-anchor="middle">（第 4 课）</text>

  <path class="arrow" d="M432 92 H448"/>

  <rect x="450" y="60" width="120" height="64" rx="8" fill="#FFFACD" stroke="#B3A5B3" stroke-width="1.5"/>
  <text class="head" x="510" y="86" text-anchor="middle">④ 记忆</text>
  <text class="sub" x="510" y="102" text-anchor="middle">checkpointer</text>
  <text class="sub" x="510" y="116" text-anchor="middle">（第 6 课）</text>

  <path class="arrow" d="M572 92 H588"/>

  <rect x="590" y="60" width="120" height="64" rx="8" fill="#FFDFD3" stroke="#B3A5B3" stroke-width="1.5"/>
  <text class="head" x="650" y="86" text-anchor="middle">⑤ 人工审批</text>
  <text class="sub" x="650" y="102" text-anchor="middle">interrupt</text>
  <text class="sub" x="650" y="116" text-anchor="middle">（第 7 课）</text>

  <path class="arrow" d="M712 92 H728"/>

  <rect x="730" y="60" width="130" height="64" rx="8" fill="#D4F0F0" stroke="#B3A5B3" stroke-width="1.5"/>
  <text class="head" x="795" y="86" text-anchor="middle">⑥ 流式返回</text>
  <text class="sub" x="795" y="102" text-anchor="middle">stream_mode</text>
  <text class="sub" x="795" y="116" text-anchor="middle">（第 11 课）</text>

  <!-- 每步：故障排查 -->
  <text class="label" x="90" y="170" text-anchor="middle">排查：</text>
  <text class="sub" x="90" y="186" text-anchor="middle">注入输入被当指令？</text>
  <text class="sub" x="90" y="200" text-anchor="middle">（当数据不当指令）</text>

  <text class="label" x="230" y="170" text-anchor="middle">排查：</text>
  <text class="sub" x="230" y="186" text-anchor="middle">路由错？调用序列</text>
  <text class="sub" x="230" y="200" text-anchor="middle">对不对（第 12 课）</text>

  <text class="label" x="370" y="170" text-anchor="middle">排查：</text>
  <text class="sub" x="370" y="186" text-anchor="middle">幻觉参数？超时？</text>
  <text class="sub" x="370" y="200" text-anchor="middle">重复调用幂等？（第 8 课）</text>

  <text class="label" x="510" y="170" text-anchor="middle">排查：</text>
  <text class="sub" x="510" y="186" text-anchor="middle">thread_id 对不对？</text>
  <text class="sub" x="510" y="200" text-anchor="middle">断点恢复了吗？</text>

  <text class="label" x="650" y="170" text-anchor="middle">排查：</text>
  <text class="sub" x="650" y="186" text-anchor="middle">暂停了吗？resume</text>
  <text class="sub" x="650" y="200" text-anchor="middle">了吗？超时放弃？</text>

  <text class="label" x="795" y="170" text-anchor="middle">排查：</text>
  <text class="sub" x="795" y="186" text-anchor="middle">事件顺序对？客户端</text>
  <text class="sub" x="795" y="200" text-anchor="middle">断开清理了没？</text>

  <!-- 底部：全课收束 -->
  <rect x="30" y="235" width="830" height="70" rx="10" fill="#FFFACD" stroke="#B3A5B3" stroke-width="1.5"/>
  <text class="head" x="445" y="258" text-anchor="middle">排查顺序（第 12 课 badcase 复盘）：先看轨迹（调用序列对不对）→ 再看工具描述/权限 → 再看记忆</text>
  <text class="sub" x="445" y="282" text-anchor="middle">第 13 课演示：同一张图跑三条链路——低危工具自动（链路 A）、高危工具暂停审批（链路 B）、拒绝不执行（链路 C）</text>
  <text class="sub" x="445" y="298" text-anchor="middle">全课十三课从"图的零件"（1~3）→ 工具与循环（4~5）→ 持久化与审批（6~7）→ 生产化（8~11）→ 评估（12）→ 选型（13）</text>
</svg>
