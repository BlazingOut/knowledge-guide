<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460">
  <rect width="900" height="460" fill="#f8fafc"/>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033} .box{fill:#fff;stroke:#2563eb;stroke-width:3} .vbox{fill:#f1f5f9;stroke:#94a3b8;stroke-width:3;stroke-dasharray:6 5} .rbox{fill:#fff;stroke:#475569;stroke-width:2} .arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#m)} .arrow-loop{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#m)} .label{font-size:12;fill:#475569} .desc{font-size:12;fill:#64748b} .head{font-size:16;font-weight:bold} .note{font-size:13;fill:#475569}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <text x="450" y="36" text-anchor="middle" font-size="24" font-weight="bold">ReAct 图：一条条件边构成的 Agent 循环</text>

  <rect class="vbox" x="60" y="80" width="110" height="52" rx="10"/>
  <text class="head" x="115" y="106" text-anchor="middle">START</text>
  <text class="desc" x="115" y="124" text-anchor="middle">虚拟入口</text>
  <path class="arrow" d="M172 106 H228"/>
  <rect class="box" x="230" y="80" width="190" height="64" rx="10"/>
  <text class="head" x="325" y="104" text-anchor="middle">model</text>
  <text class="desc" x="325" y="124" text-anchor="middle">节点：调模型，可能返回工具调用</text>

  <path class="arrow" d="M325 146 V188"/>
  <rect class="rbox" x="230" y="190" width="190" height="64" rx="10"/>
  <text class="head" x="325" y="212" text-anchor="middle">route</text>
  <text class="desc" x="325" y="232" text-anchor="middle">条件边：还有工具调用吗？</text>

  <path class="arrow" d="M422 222 H516"/>
  <text class="label" x="469" y="214" text-anchor="middle">有 → 去 tools</text>
  <rect class="box" x="520" y="190" width="190" height="64" rx="10"/>
  <text class="head" x="615" y="212" text-anchor="middle">tools</text>
  <text class="desc" x="615" y="232" text-anchor="middle">ToolNode：执行工具，结果回填</text>

  <path class="arrow-loop" d="M615 188 V112 H428"/>
  <text class="label" x="522" y="104">工具结果回给模型</text>

  <path class="arrow" d="M325 256 V326"/>
  <text class="label" x="340" y="295">没有工具调用 → 结束</text>
  <rect class="vbox" x="270" y="330" width="110" height="52" rx="10"/>
  <text class="head" x="325" y="356" text-anchor="middle">END</text>
  <text class="desc" x="325" y="374" text-anchor="middle">虚拟出口</text>

  <text class="note" x="450" y="420" text-anchor="middle">这张图 = 手写循环的翻译：while 条件 → route 判断；循环体 → model + tools</text>
</svg>
