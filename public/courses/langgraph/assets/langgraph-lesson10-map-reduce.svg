<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <rect width="900" height="420" fill="#FFFFFF"/>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#6B5F6B} .title{font-size:20;font-weight:bold} .head{font-size:13;font-weight:bold} .sub{font-size:11;fill:#8A7F8A} .label{font-size:12;fill:#8A7F8A} .note{font-size:12;fill:#8A7F8A} .arrow{stroke:#B3A5B3;stroke-width:2.5;fill:none;marker-end:url(#m)} .dash{stroke:#C77B6B;stroke-width:2;fill:none;stroke-dasharray:6,4;marker-end:url(#m2)}</style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#B3A5B3"/></marker>
    <marker id="m2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C77B6B"/></marker>
  </defs>

  <text class="title" x="450" y="32" text-anchor="middle">Map-Reduce：Send 并行分发（fan-out）+ reducer 合并（fan-in）</text>

  <!-- model：拆任务 -->
  <rect x="40" y="160" width="150" height="70" rx="10" fill="#FFDFD3" stroke="#B3A5B3" stroke-width="1.5"/>
  <text class="head" x="115" y="188" text-anchor="middle">model 确认任务</text>
  <text class="sub" x="115" y="206" text-anchor="middle">收到 N 条记录，准备分发</text>

  <!-- Send 分发：model → 三个 process 实例（同节点，不同 payload） -->
  <path class="dash" d="M192 195 C260 120 270 75 328 75"/>
  <path class="dash" d="M192 195 H328"/>
  <path class="dash" d="M192 195 C260 270 270 305 328 305"/>
  <text class="label" x="252" y="58" text-anchor="middle">Send("process", {"doc_id": "d1", ...})</text>
  <text class="label" x="252" y="185" text-anchor="middle">Send("process", {"doc_id": "d2", ...})</text>
  <text class="label" x="252" y="320" text-anchor="middle">Send("process", {"doc_id": "d3", ...})</text>
  <text class="label" x="252" y="345" text-anchor="middle">条件边返回 Send 列表（数量由数据决定）</text>

  <!-- process 三个并行实例（处理管线） -->
  <rect x="330" y="40" width="170" height="70" rx="10" fill="#D4F0F0" stroke="#B3A5B3" stroke-width="1.5"/>
  <text class="head" x="415" y="62" text-anchor="middle">process（d1 跑步）</text>
  <text class="sub" x="415" y="82" text-anchor="middle">管线：清洗→分类→打标</text>
  <text class="sub" x="415" y="98" text-anchor="middle">耗时 0.3s</text>
  <rect x="330" y="155" width="170" height="70" rx="10" fill="#E2DFFF" stroke="#B3A5B3" stroke-width="1.5"/>
  <text class="head" x="415" y="177" text-anchor="middle">process（d2 晚饭）</text>
  <text class="sub" x="415" y="197" text-anchor="middle">管线：清洗→分类→打标</text>
  <text class="sub" x="415" y="213" text-anchor="middle">耗时 0.3s</text>
  <rect x="330" y="270" width="170" height="70" rx="10" fill="#FFFACD" stroke="#B3A5B3" stroke-width="1.5"/>
  <text class="head" x="415" y="292" text-anchor="middle">process（d3 睡前）</text>
  <text class="sub" x="415" y="312" text-anchor="middle">管线：清洗→分类→打标</text>
  <text class="sub" x="415" y="328" text-anchor="middle">耗时 0.3s</text>

  <text class="note" x="415" y="375" text-anchor="middle">同一节点的 3 个实例，同一 super-step 并行执行，总耗时 0.3s（不是 0.9s）</text>

  <!-- fan-in：process → summarize -->
  <path class="arrow" d="M502 75 C560 130 580 195 618 195"/>
  <path class="arrow" d="M502 195 H618"/>
  <path class="arrow" d="M502 305 C560 260 580 195 618 195"/>
  <text class="label" x="552" y="165" text-anchor="middle">普通边 fan-in（等全部完成）</text>

  <!-- summarize：合并 -->
  <rect x="620" y="160" width="160" height="70" rx="10" fill="#D4F0F0" stroke="#B3A5B3" stroke-width="1.5"/>
  <text class="head" x="700" y="188" text-anchor="middle">summarize 合并</text>
  <text class="sub" x="700" y="206" text-anchor="middle">reducer：Annotated[list, add]</text>

  <text class="note" x="450" y="408" text-anchor="middle">运行示例：3 条记录的处理结果都追加进 processed（reducer 合并），summarize 拿到完整清单后汇总作答</text>
</svg>
