<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <rect width="900" height="360" fill="#f8fafc"/>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033} .arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#m)} .label{font-size:12;fill:#475569} .row-label{font-size:14;font-weight:bold;fill:#334155} .note{font-size:12} .chip-overwrite{fill:#fdba74} .chip-append{fill:#6ee7b7} .chip-text{font-size:15}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <text x="450" y="36" text-anchor="middle" font-size="24" font-weight="bold">字段合并的两种行为：覆盖与追加</text>

  <text class="row-label" x="60" y="76">普通字段（LastValue）：覆盖写</text>
  <rect class="chip-overwrite" x="170" y="92" width="130" height="52" rx="8"/>
  <text class="chip-text" x="235" y="123" text-anchor="middle">A</text>
  <path class="arrow" d="M302 118 H378"/>
  <text class="label" x="340" y="110" text-anchor="middle">覆盖写</text>
  <rect class="chip-overwrite" x="380" y="92" width="130" height="52" rx="8"/>
  <text class="chip-text" x="445" y="123" text-anchor="middle">B</text>
  <path class="arrow" d="M512 118 H588"/>
  <text class="label" x="550" y="110" text-anchor="middle">覆盖写</text>
  <rect class="chip-overwrite" x="590" y="92" width="130" height="52" rx="8"/>
  <text class="chip-text" x="655" y="123" text-anchor="middle">C</text>
  <text class="note" x="235" y="168" text-anchor="middle" fill="#dc2626">旧值被替换，消失</text>
  <text class="note" x="655" y="168" text-anchor="middle" fill="#64748b">最终只保留最后写入</text>

  <text class="row-label" x="60" y="216">reducer 字段（追加）：旧值保留 + 新值合并</text>
  <rect class="chip-append" x="170" y="232" width="150" height="52" rx="8"/>
  <text class="chip-text" x="245" y="263" text-anchor="middle">[A]</text>
  <path class="arrow" d="M322 258 H398"/>
  <text class="label" x="360" y="250" text-anchor="middle">reducer 合并</text>
  <rect class="chip-append" x="400" y="232" width="170" height="52" rx="8"/>
  <text class="chip-text" x="485" y="263" text-anchor="middle">[A, B]</text>
  <path class="arrow" d="M572 258 H648"/>
  <text class="label" x="610" y="250" text-anchor="middle">reducer 合并</text>
  <rect class="chip-append" x="650" y="232" width="170" height="52" rx="8"/>
  <text class="chip-text" x="735" y="263" text-anchor="middle">[A, B, C]</text>
  <text class="note" x="245" y="308" text-anchor="middle" fill="#15803d">旧值保留</text>
  <text class="note" x="735" y="308" text-anchor="middle" fill="#64748b">累积全部值</text>
</svg>
